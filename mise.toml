[env]
CGO_ENABLED = "1"

[tools]
go = "1.26"
caddy = "2.10.2"
node = "24.13.1"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w $(find . -name '*.go' -not -path './.git/*')"

[tasks.fmt-check]
description = "Verify Go source formatting"
run = '''unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))
if [ -n "$unformatted" ]; then
  printf '%s\n' "Unformatted Go files:" "$unformatted" >&2
  exit 1
fi
'''

[tasks.lint]
description = "Run static checks"
run = "go vet ./..."

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.assets]
description = "Rebuild reproducible embedded Tailwind v4 dashboard CSS and reject drift"
run = '''set -eu
D=internal/adapters/inbound/httpapi
out=$(mktemp)
npm_root=$(mktemp -d)
trap 'rm -f "$out"; rm -rf "$npm_root"' EXIT
cp package.json package-lock.json "$npm_root"/
npm ci --prefix "$npm_root" --ignore-scripts --no-audit --no-fund
"$npm_root/node_modules/.bin/tailwindcss" -i "$D/dashboard.tailwind.css" -o "$out" --minify
cmp "$out" "$D/dashboard.css"
grep -q 'tailwindcss v4.1.17' "$D/dashboard.css"'''

[tasks.e2e]
description = "Run bootstrap black-box end-to-end smoke test"
run = "./scripts/smoke.sh"

[tasks.test-race]
description = "Run the Go test suite with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Report and enforce aggregate repository Go statement coverage"
run = '''set -eu
# One aggregate profile is measured across the complete test invocation.
go test -coverprofile=coverage.out ./...
coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
printf 'aggregate statement coverage: %s%%\n' "$coverage"
awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "aggregate coverage %.2f%% is below required 85%%\n", coverage > "/dev/stderr"; exit 1 } }'
'''

[tasks.build]
description = "Build the mirage executable"
run = "mkdir -p bin && go build -o bin/mirage ./cmd/mirage"

[tasks.smoke]
description = "Build and black-box smoke-test mirage"
run = "./scripts/smoke.sh"

[tasks.check]
description = "Run formatting, tests, coverage, build, and black-box smoke checks"
depends = ["fmt-check", "lint", "test", "coverage", "coverage-mir05", "coverage-mir06", "mir06-scenario", "assets", "coverage-mir07", "coverage-mir08", "dashboard-artifact", "build", "smoke"]



[tasks.coverage-mir08]
description = "Enforce dashboard and aggregate HTTP adapter coverage"
run = '''set -eu
go test -coverprofile=/tmp/mirage-dashboard.cover ./internal/adapters/inbound/httpapi
go tool cover -func=/tmp/mirage-dashboard.cover | awk '/dashboard.go/ { n += $3 + 0; d++ } END { if (!d || n/d < 85) exit 1 }'
go tool cover -func=/tmp/mirage-dashboard.cover | awk '/^total:/ {gsub(/%/, "", $3); if ($3 < 90) exit 1}' '''

[tasks.dashboard-artifact]
description = "Run seeded private-dashboard HTTP/DOM smoke artifact"
run = "./scripts/dashboard_artifact.sh"

[tasks.test-domain]
description = "Run domain contract tests"
run = "go test ./internal/domain"

[tasks.test-libsql]
description = "Run MIR-03 real embedded libSQL migration/CRUD/reopen artifact"
run = "./scripts/libsql-integration.sh"

[tasks.caddy-integration]
description = "Run hermetic real-Caddy MIR-04 adapter harness"
run = "mise exec caddy@2.10.2 -- go test ./internal/adapters/outbound/caddy -run TestRealCaddyAdminHarness -count=1"

[tasks.process-artifact]
description = "Run MIR-05 real OS process, health, and bounded-log adapter artifact"
run = "./scripts/process_artifact.sh"

[tasks.coverage-mir05]
description = "Enforce MIR-05 package coverage"
run = "./scripts/coverage_mir05.sh"

[tasks.mir06-scenario]
description = "Run deterministic MIR-06 application lifecycle trace artifact"
run = "./scripts/mir06-scenario.sh"

[tasks.coverage-mir06]
description = "Enforce MIR-06 application coverage"
run = "./scripts/coverage_mir06.sh"

[tasks.api-conformance]
description = "Run MIR-07 random-port private API conformance artifact"
run = "./scripts/api-conformance.sh"

[tasks.coverage-mir07]
description = "Enforce MIR-07 HTTP API package coverage"
run = '''set -eu
go test -coverprofile=/tmp/mirage-httpapi.cover ./internal/adapters/inbound/httpapi
go tool cover -func=/tmp/mirage-httpapi.cover | awk '/^total:/ {gsub(/%/, "", $3); if ($3 < 90) exit 1}'
'''

[tasks.cli-artifact]
description = "Run MIR-09 compiled CLI contract artifact"
run = "./scripts/cli-artifact.sh"

[tasks.release]
description = "Build a checksummed, clean-directory release candidate"
run = "./scripts/release.sh"

[tasks.e2e-release]
description = "Run MIR-10 release-candidate end-to-end harness"
run = "./scripts/e2e-release.sh"

[tasks.ci]
description = "MIR-10 release gate: sequential artifacts, race, coverage and release smoke"
run = """set -eu
mise run fmt-check
mise run lint
mise run test-race
mise run coverage
mise run coverage-mir05
mise run coverage-mir06
mise run coverage-mir07
mise run coverage-mir08
mise run test-libsql
mise run caddy-integration
mise run process-artifact
mise run api-conformance
mise run dashboard-artifact
mise run cli-artifact
mise run mir06-scenario
mise run assets
mise run release
"""
