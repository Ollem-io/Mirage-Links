[tools]
go = "1.26"
caddy = "2.10.2"
node = "24.13.1"
"npm:@tailwindcss/cli" = "4.1.17"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w $(find . -name '*.go' -not -path './.git/*')"

[tasks.fmt-check]
description = "Verify Go source formatting"
run = '''unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))
if [ -n "$unformatted" ]; then
  printf '%s\n' "Unformatted Go files:" "$unformatted" >&2
  exit 1
fi
'''

[tasks.lint]
description = "Run static checks"
run = "go vet ./..."

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.assets]
description = "Verify the pinned Tailwind asset tool is available"
run = "tailwindcss --help >/dev/null"

[tasks.e2e]
description = "Run bootstrap black-box end-to-end smoke test"
run = "./scripts/smoke.sh"

[tasks.test-race]
description = "Run the Go test suite with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Report repository coverage and enforce 85% for meaningful bootstrap code"
run = '''set -eu
# Print repository-wide coverage as required. Packages containing only package
# documentation have no statements; cmd/mirage has one untestable os.Exit
# boundary statement and is covered by smoke. Enforce the injectable logic.
go test -cover ./...
output=$(go test -cover ./internal/adapters/inbound/cli ./internal/composition)
printf '%s\n' "$output"
coverage=$(printf '%s\n' "$output" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p' | awk 'BEGIN { min=101; seen=0 } { if ($1 < min) min=$1; seen=1 } END { if (!seen) exit 1; printf "%.2f", min }')
awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "meaningful-code coverage %.2f%% is below required 85%%\n", coverage > "/dev/stderr"; exit 1 } }'
'''

[tasks.build]
description = "Build the mirage executable"
run = "mkdir -p bin && go build -o bin/mirage ./cmd/mirage"

[tasks.smoke]
description = "Build and black-box smoke-test mirage"
run = "./scripts/smoke.sh"

[tasks.check]
description = "Run formatting, tests, coverage, build, and black-box smoke checks"
depends = ["fmt-check", "lint", "test", "coverage", "build", "smoke"]

[tasks.test-domain]
description = "Run domain contract tests"
run = "go test ./internal/domain"
