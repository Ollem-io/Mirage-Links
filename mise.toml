[env]
CGO_ENABLED = "1"

[tools]
go = "1.26"
caddy = "2.10.2"
node = "24.13.1"
"npm:@tailwindcss/cli" = "4.1.17"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w $(find . -name '*.go' -not -path './.git/*')"

[tasks.fmt-check]
description = "Verify Go source formatting"
run = '''unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))
if [ -n "$unformatted" ]; then
  printf '%s\n' "Unformatted Go files:" "$unformatted" >&2
  exit 1
fi
'''

[tasks.lint]
description = "Run static checks"
run = "go vet ./..."

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.assets]
description = "Verify the pinned Tailwind asset tool is available"
run = "tailwindcss --help >/dev/null"

[tasks.e2e]
description = "Run bootstrap black-box end-to-end smoke test"
run = "./scripts/smoke.sh"

[tasks.test-race]
description = "Run the Go test suite with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Report and enforce aggregate repository Go statement coverage"
run = '''set -eu
# One aggregate profile is measured across the complete test invocation.
go test -coverprofile=coverage.out ./...
coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
printf 'aggregate statement coverage: %s%%\n' "$coverage"
awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "aggregate coverage %.2f%% is below required 85%%\n", coverage > "/dev/stderr"; exit 1 } }'
'''

[tasks.build]
description = "Build the mirage executable"
run = "mkdir -p bin && go build -o bin/mirage ./cmd/mirage"

[tasks.smoke]
description = "Build and black-box smoke-test mirage"
run = "./scripts/smoke.sh"

[tasks.check]
description = "Run formatting, tests, coverage, build, and black-box smoke checks"
depends = ["fmt-check", "lint", "test", "coverage", "coverage-mir05", "coverage-mir06", "mir06-scenario", "build", "smoke"]

[tasks.test-domain]
description = "Run domain contract tests"
run = "go test ./internal/domain"

[tasks.test-libsql]
description = "Run MIR-03 real embedded libSQL migration/CRUD/reopen artifact"
run = "./scripts/libsql-integration.sh"

[tasks.caddy-integration]
description = "Run hermetic real-Caddy MIR-04 adapter harness"
run = "mise exec caddy@2.10.2 -- go test ./internal/adapters/outbound/caddy -run TestRealCaddyAdminHarness -count=1"

[tasks.process-artifact]
description = "Run MIR-05 real OS process, health, and bounded-log adapter artifact"
run = "./scripts/process_artifact.sh"

[tasks.coverage-mir05]
description = "Enforce MIR-05 package coverage"
run = "./scripts/coverage_mir05.sh"

[tasks.mir06-scenario]
description = "Run deterministic MIR-06 application lifecycle trace artifact"
run = "./scripts/mir06-scenario.sh"

[tasks.coverage-mir06]
description = "Enforce MIR-06 application coverage"
run = "./scripts/coverage_mir06.sh"

[tasks.api-conformance]
description = "Run MIR-07 random-port private API conformance artifact"
run = "./scripts/api-conformance.sh"

[tasks.coverage-mir07]
description = "Enforce MIR-07 HTTP API package coverage"
run = '''set -eu
go test -coverprofile=/tmp/mirage-httpapi.cover ./internal/adapters/inbound/httpapi
go tool cover -func=/tmp/mirage-httpapi.cover | awk '/^total:/ {gsub(/%/, "", $3); if ($3 < 90) exit 1}'
'''
